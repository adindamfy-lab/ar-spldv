<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Kantin Ceria: Model SPLDV</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    .order-card {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 16px 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      z-index: 1000;
      border: 2px solid #f59e0b;
    }
    .order-card h4 { margin: 0 0 6px 0; color: #d97706; font-size: 1rem; }
    .order-card p { margin: 0 0 12px 0; font-size: 0.85rem; color: #334155; line-height: 1.4; }
    .input-group { display: flex; gap: 8px; }
    .input-group input {
      flex: 1;
      padding: 8px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
    }
    .input-group button {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .feedback { margin-top: 8px; font-size: 0.8rem; font-weight: bold; display: none; }
  </style>
</head>
<body>

  <div class="order-card">
    <h4>🍜 Ibu Kantin: "Meja 1, Pesanan Datang!"</h4>
    <p>Lihat makanan 3D di mejamu: Ada <strong>2 Mangkok Bakso (x)</strong> dan <strong>1 Es Teh (y)</strong> seharga <strong>Rp25.000</strong>.</p>
    <div class="input-group">
      <input type="text" id="model-input" placeholder="Tulis model (misal: 2x+y=25000)">
      <button onclick="periksaModel()">Verifikasi</button>
    </div>
    <div id="fb-text" class="feedback"></div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <!-- Meja Kantin 3D -->
      <a-box position="0 0 0" width="2" height="0.04" depth="1.6" color="#b45309"></a-box>

      <!-- Karakter Standee Penjual Kantin -->
      <a-box position="0 0.5 -0.6" width="0.6" height="0.8" depth="0.02" color="#fbbf24">
        <a-text value="Ibu Kantin" align="center" position="0 0.35 0.02" scale="0.3 0.3 0.3" color="#78350f"></a-text>
      </a-box>

      <!-- Mangkok Bakso 1 (Variabel x) -->
      <a-entity position="-0.4 0.1 0.1">
        <a-cylinder color="#f1f5f9" height="0.14" radius="0.16"></a-cylinder>
        <a-sphere position="0 0.08 0" radius="0.13" color="#7c2d12"></a-sphere>
        <a-text value="Bakso (x)" align="center" position="0 0.25 0" rotation="-30 0 0" scale="0.25 0.25 0.25" color="#ffffff"></a-text>
      </a-entity>

      <!-- Mangkok Bakso 2 (Variabel x) -->
      <a-entity position="0 0.1 0.3">
        <a-cylinder color="#f1f5f9" height="0.14" radius="0.16"></a-cylinder>
        <a-sphere position="0 0.08 0" radius="0.13" color="#7c2d12"></a-sphere>
        <a-text value="Bakso (x)" align="center" position="0 0.25 0" rotation="-30 0 0" scale="0.25 0.25 0.25" color="#ffffff"></a-text>
      </a-entity>

      <!-- Gelas Es Teh (Variabel y) -->
      <a-entity position="0.4 0.14 0.1">
        <a-cylinder color="#fed7aa" height="0.24" radius="0.1" opacity="0.85"></a-cylinder>
        <a-cylinder position="0 0.1 0" color="#d97706" height="0.04" radius="0.02" rotation="0 0 15"></a-cylinder>
        <a-text value="Es Teh (y)" align="center" position="0 0.28 0" rotation="-30 0 0" scale="0.25 0.25 0.25" color="#ffffff"></a-text>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    function periksaModel() {
      const val = document.getElementById('model-input').value.replace(/\s+/g, '').toLowerCase();
      const fb = document.getElementById('fb-text');
      fb.style.display = 'block';

      if (val === "2x+y=25000" || val === "2x+1y=25000") {
        fb.style.color = "#15803d";
        fb.innerText = "Benar! 2 Bakso (2x) + 1 Es Teh (y) = Rp25.000. Kamu berhasil membuat model aljabar!";
      } else {
        fb.style.color = "#b91c1c";
        fb.innerText = "Belum tepat. Hitung jumlah bakso (x) dan es teh (y), lalu samakan dengan 25000.";
      }
    }
  </script>
</body>
</html>
